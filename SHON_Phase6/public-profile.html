<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Member | SHONnetwork</title><link rel="stylesheet" href="shon-header.css"><style>body{margin:0;background:#f6f8f5;color:#183c31;font:16px/1.55 system-ui,Arial,sans-serif}main{max-width:900px;margin:auto;padding:24px 16px 70px}header{background:#fff;padding:16px;border-bottom:1px solid #ddd}header a{margin-right:16px;color:#17604b}section,article{background:white;border:1px solid #dce5dc;border-radius:12px;padding:20px;margin:15px 0}h1{margin:0 0 8px}p{white-space:pre-wrap;overflow-wrap:anywhere}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.cards article{margin:0}.tag{display:inline-block;background:var(--c,#546c61);color:white;padding:5px 11px;border-radius:8px;font-weight:700;font-size:13px}a{color:#17604b}#status{color:#53675c}</style></head><body><header><a href="index.html">🏡 <b>SHON</b>network</a><a href="discover.html">Discover</a><a href="members.html">Sign In</a><a href="connections.html">Messages</a></header><main><h1 id="name">Member profile</h1><p id="status" role="status">Loading public information…</p><section id="profile" hidden><p id="region"></p><h2>About</h2><p id="bio"></p><h2>What I need</h2><p id="needs"></p><h2>What I can offer</h2><p id="offers"></p></section><section id="opportunities" hidden><h2>Public opportunities</h2><div id="cards" class="cards"></div></section><p>Only information explicitly shared in the public directory is displayed here. Private profile stories are never loaded.</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script><script>(async()=>{const $=id=>document.getElementById(id);const id=new URLSearchParams(location.search).get('user');if(!id||!/^[a-f0-9-]{36}$/i.test(id)){$('status').textContent='No member was selected.';return;}if(!window.supabase){$('status').textContent='Connection unavailable.';return;}const db=window.supabase.createClient('https://wqcninwqeyfoyxlllwdy.supabase.co','sb_publishable_YTHhpIPiKKHGBLMdkj_4og_Uyq_t_SX',{auth:{storageKey:'sb-wqcninwqeyfoyxlllwdy-auth-token'}});try{const r=await db.rpc('shon_public_directory');if(r.error)throw r.error;const p=(r.data||[]).find(x=>String(x.user_id)===id);if(!p){$('status').textContent='This member is not in the public directory, or has chosen not to share a public profile.';return;}$('name').textContent=p.display_name||'SHONnetwork member';for(const [el,key] of [['region','region'],['bio','bio'],['needs','needs_text'],['offers','offers_text']])$(el).textContent=p[key]||'Not specified';$('profile').hidden=false;$('status').textContent='Public member profile';const l=await db.from('listings').select('id,user_id,title,description,region,status,visual_category,expires_at').eq('user_id',id).eq('status','published').limit(100);if(!l.error){const colors={housing_needed:'#367d35',housing_offered:'#0878c9',property_presence:'#8838b5',help_skills:'#c84835',companionship:'#aa7a0c',community:'#087b79'};const names={housing_needed:'Housing Needed',housing_offered:'Housing Offered',property_presence:'Property Presence',help_skills:'Help / Skills Offered',companionship:'Companionship',community:'Community / Collaboration'};const active=(l.data||[]).filter(x=>!x.expires_at||new Date(x.expires_at).getTime()>Date.now());const cards=$('cards');for(const x of active){const a=document.createElement('article');const tag=document.createElement('span');tag.className='tag';tag.style.setProperty('--c',colors[x.visual_category]||'#546c61');tag.textContent=names[x.visual_category]||'Opportunity';const h=document.createElement('h3');h.textContent=x.title||'Opportunity';const d=document.createElement('p');d.textContent=x.description||'';const region=document.createElement('small');region.textContent=x.region||'';a.append(tag,h,region,d);cards.append(a)}if(active.length){$('opportunities').hidden=false;}}}catch(e){$('status').textContent='Could not load the public profile: '+e.message;}})();</script></body></html>
