name: SHON v1 static link integrity
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - 'tests/shon-v1-static-links.cjs'
      - '.github/workflows/shon-static-links.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-links:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify first-version local HTML resources
        run: node tests/shon-v1-static-links.cjs
